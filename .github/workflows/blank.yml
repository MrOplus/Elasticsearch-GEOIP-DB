name: DUMB
on: [push]

jobs:
  debug:
    name: Debug
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up secret file
      env:
        LICENSE_KEY: ${{ secrets.LICENSE_KEY }}        
      run: |
        echo $LICENSE_KEY >> secrets.txt

    - name: Run tmate
      uses: mxschmitt/action-tmate@v2
